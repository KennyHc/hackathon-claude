<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1st of 16 teams · Team Overfitters</title>
<meta name="description" content="Team Overfitters finished 1st of 16 at the Talky × Anthropic “Close the Books” bank-reconciliation hackathon: 96.71 on the unseen FINAL set, built with Claude Code.">
<link rel="canonical" href="https://kennyhc.github.io/hackathon-claude/infographic/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kennyhc.github.io/hackathon-claude/infographic/">
<meta property="og:title" content="1st of 16 teams · Team Overfitters">
<meta property="og:description" content="96.71 on the unseen FINAL set at the Talky × Anthropic “Close the Books” hackathon. One-page summary of how we did it.">
<meta property="og:image" content="https://kennyhc.github.io/hackathon-claude/infographic/infographic-dark.png">
<meta property="og:image:width" content="2160"><meta property="og:image:height" content="2700">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F8F5EF" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23D97757'/%3E%3Cpath d='M10 7h12v6a6 6 0 0 1-12 0V7ZM14 19h4v4h-4zM11 24h10v2H11z' fill='white'/%3E%3C/svg%3E">
<style>
:root{--bg:#F8F5EF;--ink:#141413;--muted:#67635B;--hair:rgba(20,20,19,.16);--accent:#AD4E2B;--chip:rgba(20,20,19,.04)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121211;--ink:#F4F0E8;--muted:#9A958A;--hair:rgba(244,240,232,.16);--accent:#D97757;--chip:rgba(244,240,232,.05)}}
:root[data-theme="dark"]{--bg:#121211;--ink:#F4F0E8;--muted:#9A958A;--hair:rgba(244,240,232,.16);--accent:#D97757;--chip:rgba(244,240,232,.05)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;
  padding:24px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
main{max-width:720px;margin:0 auto;display:grid;gap:18px}
.card{border-radius:14px;overflow:hidden;border:1px solid var(--hair);box-shadow:0 10px 40px -18px rgba(0,0,0,.35);line-height:0}
.card img{width:100%;height:auto;display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;justify-content:space-between}
.links,.tools{display:flex;flex-wrap:wrap;gap:8px}
a.btn,button.btn{font:inherit;font-size:14px;color:var(--ink);background:var(--chip);border:1px solid var(--hair);border-radius:999px;padding:6px 14px;text-decoration:none;cursor:pointer;white-space:nowrap}
a.btn:hover,button.btn:hover{border-color:var(--accent);color:var(--accent)}
a.btn.primary{border-color:var(--accent);color:var(--accent)}
p.note{margin:0;color:var(--muted);font-size:14px;text-align:center}
</style>
</head>
<body>
<main>
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Team Overfitters: 1st of 16 teams, 96.71 on the unseen FINAL set</h1>
  <div class="card">
    <picture id="pic">
      <source id="srcDark" srcset="infographic-dark.png" media="(prefers-color-scheme: dark)">
      <img id="img" src="infographic-light.png" width="2160" height="2700" alt="Infographic. 1st of 16 teams, Team Overfitters, Close the Books bank reconciliation, about 80 participants, Madrid, 7 Nov 2026. Result: 96.71 out of 100 on the unseen FINAL set; LIVE leaderboard 96.46; organisers' starter 11.22. How we matched every payment: 42 % of lines through payment files at 99.6–100 % right, 45 % through text and amounts at 98–99.5 %, 2 % edge cases, 12 % with no invoice labelled by a model. A wrong match costs more than a missing one: 99.6 % of matches right, 93.0 % found. Leaderboard: 6 h 04 min in first place, from 12:39 to 18:00 and from 18:47 to 19:30; last to first in one submission, 0 to 93.73. Built by 4 people on Claude Code.">
    </picture>
  </div>
  <div class="bar">
    <div class="links">
      <a class="btn primary" href="https://kennyhc.github.io/hackathon-claude/guide/">How we solved it →</a>
      <a class="btn" href="https://kennyhc.github.io/hackathon-claude/atlas/">The data, visualised →</a>
      <a class="btn" href="https://github.com/KennyHc/hackathon-claude">Code</a>
    </div>
    <div class="tools">
      <button class="btn" id="theme" type="button">Light / dark</button>
      <a class="btn" id="dl" href="infographic-light.png" download="overfitters-infographic.png">Download PNG</a>
    </div>
  </div>
  <p class="note">Talky × Anthropic “Close the Books” hackathon · Madrid, 7 Nov 2026 · made with Claude Code</p>
</main>
<script>
(function(){
  var root=document.documentElement, src=document.getElementById('srcDark'), img=document.getElementById('img'), dl=document.getElementById('dl');
  var mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');
  function cur(){ var t=root.getAttribute('data-theme'); return t||((mq&&mq.matches)?'dark':'light'); }
  function apply(){ var t=cur(); src.media=root.getAttribute('data-theme')?'not all':'(prefers-color-scheme: dark)'; img.src='infographic-'+t+'.png'; dl.href='infographic-'+t+'.png'; }
  document.getElementById('theme').addEventListener('click',function(){ root.setAttribute('data-theme',cur()==='dark'?'light':'dark'); apply(); });
  if(mq&&mq.addEventListener) mq.addEventListener('change',apply);
  apply();
})();
</script>
</body>
</html>
